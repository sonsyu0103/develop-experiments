# モジュール境界とレイヤの依存方向を「許可リスト」で宣言する。
# ここに書かなかった依存はすべて禁止され、どのコンポーネントにも属さない
# パッケージも通知になる (書き忘れが禁止側に倒れる)。
#
# このファイルは本体コードだけを見る。テストコードには緩和があるため
# .go-arch-lint.tests.yml が別に存在する。両方を通す必要がある。
# 設計の背景は docs/adr/0017-arch-lint-and-depguard.md
version: 3
workdir: .

allow:
  # deepScan (AST による DI 解析) は使わない。
  # cmd/api での結線を「注入元コンポーネント -> 注入先コンポーネント」の
  # 依存として数えるため、通すには usecase -> infrastructure を
  # 宣言する必要がある。守りたい向きの逆であり、宣言した瞬間に
  # 本体コードからの import まで許可されてしまう
  deepScan: false

# 本体用のため、テストファイルは対象外にする
excludeFiles:
  - "_test\\.go$"

vendors:
  gin:
    in: github.com/gin-gonic/gin
  pgx:
    in: github.com/jackc/pgx/**
  openapi:
    in:
      - github.com/getkin/kin-openapi/**
      - github.com/oapi-codegen/**
  errgroup:
    in: golang.org/x/sync/**
  uuid:
    in: github.com/google/uuid
  oidc:
    in:
      - github.com/coreos/go-oidc/**
      - golang.org/x/oauth2
      - golang.org/x/oauth2/**
  # S3 互換ストレージ。**objectstorage だけに許可する** ——
  # ここを広く許すと、image モジュールが SDK の型を知ってよいことになり、
  # ADR 0007 の「image は S3 SDK の型を一切知らない」が破れる
  aws-s3:
    in:
      - github.com/aws/aws-sdk-go-v2/**
      # smithy-go は SDK が返すエラーの共通インターフェース。
      # DeleteObject のエラーは *smithy.GenericAPIError になるため、
      # 「対象が無い」の判定にこちらが要る (s3.go の isNotFound)
      - github.com/aws/smithy-go
  # 画像のデコード / エンコード。ドメインではなく usecase 側で使う
  imaging:
    in:
      - golang.org/x/image/**
      - github.com/HugoSmits86/nativewebp

components:
  main:
    in: cmd/api

  shared-apperr:
    in: internal/apperr
  shared-pagination:
    in: internal/pagination
  # 冪等キー (docs/adr/0015-idempotency.md)。
  # HTTP 層でヘッダを読み、永続化層で記録するため、pagination と同じく横断する
  shared-idempotency:
    in: internal/idempotency
  shared-config:
    in: internal/config
  # 構造化ログの共通フィールドと相関 ID (docs/adr/0010-log-pipeline.md 決定 4)。
  # どの層からもログを出すため、下地として扱う
  shared-logging:
    in: internal/logging

  thread-model:
    in: internal/thread/domain/model
  thread-repository:
    in: internal/thread/domain/repository
  thread-usecase:
    in: internal/thread/usecase

  comment-model:
    in: internal/comment/domain/model
  comment-repository:
    in: internal/comment/domain/repository
  comment-usecase:
    in: internal/comment/usecase

  image-model:
    in: internal/image/domain/model
  image-repository:
    in: internal/image/domain/repository
  image-usecase:
    in: internal/image/usecase

  user-model:
    in: internal/user/domain/model
  user-repository:
    in: internal/user/domain/repository
  user-usecase:
    in: internal/user/usecase

  httpapi:
    in: internal/httpapi
  httpapi-oapigen:
    in: internal/httpapi/oapigen

  postgres:
    in: internal/infrastructure/postgres
  oidc-provider:
    in: internal/infrastructure/oidc
  object-storage:
    in: internal/infrastructure/objectstorage
  postgres-sqlcgen:
    in: internal/infrastructure/postgres/sqlcgen

# どのモジュールにも属さない下地。どこからでも import してよい
commonComponents:
  - shared-apperr
  - shared-pagination
  - shared-idempotency
  - shared-logging

deps:
  # 結線だけを行うため、すべてを知ってよい唯一の場所
  main:
    anyProjectDeps: true
    canUse:
      - gin

  # Author が投稿者の公開 ID (public_id) を持つため uuid を許可する。
  # 内部 ID は運ばない (docs/adr/0014-author-resolution.md)
  thread-model:
    canUse:
      - uuid
  thread-repository:
    mayDependOn:
      - thread-model
  thread-usecase:
    canUse:
      # N+1 比較実装 (interactor_nplus1.go) が errgroup を使う
      - errgroup
      # AuthorDTO が公開 ID を持つ
      - uuid
    mayDependOn:
      - thread-model
      - thread-repository

  comment-model:
    canUse:
      - uuid
  comment-repository:
    mayDependOn:
      - comment-model
  comment-usecase:
    canUse:
      # AuthorDTO が公開 ID を持つ
      - uuid
    mayDependOn:
      - comment-model
      - comment-repository

  # image モジュール (docs/adr/0007-image-storage.md)。
  # UUID v7 の採番と object_key の組み立てをドメイン側で行うため uuid を許可する。
  # **S3 SDK は入れない。** 保存先の都合をドメインに持ち込まないため
  image-model:
    canUse:
      - uuid
  image-repository:
    canUse:
      - uuid
    mayDependOn:
      - image-model
  # 画像のユースケース。**再エンコードはここで行う** ——
  # ドメインに置くと、ドメインが画像ライブラリを知ることになる。
  # S3 SDK は入らない (保存先は ObjectStorage の背後)
  image-usecase:
    canUse:
      - uuid
      - imaging
    mayDependOn:
      - image-model
      - image-repository

  # user モジュール。public_id (UUID v7) の採番をドメイン側で行うため uuid を許可する
  user-model:
    canUse:
      - uuid
  user-repository:
    canUse:
      - uuid
    mayDependOn:
      - user-model
  # 認証のユースケース。OIDC プロバイダはインターフェースの背後に置くので、
  # ここから go-oidc / oauth2 は見えない (テストでフェイクに差し替えるため)
  user-usecase:
    canUse:
      - uuid
    mayDependOn:
      - user-model
      - user-repository

  # 外側のアダプタ。image モジュールが定義した ObjectStorage を実装する。
  # **SDK を知ってよいのはここだけ** (ADR 0007 のモジュール構成)
  object-storage:
    canUse:
      - aws-s3
    mayDependOn:
      - image-repository
      - shared-config

  # 外側のアダプタ。usecase が定義した Provider を実装する
  oidc-provider:
    canUse:
      - oidc
    mayDependOn:
      - user-usecase
      - shared-config

  # HTTP 層は usecase の DTO だけを見る。
  # domain を直接見ると内部表現がそのまま JSON に出る (ADR 0002 の前提が崩れる)
  httpapi:
    canUse:
      - gin
      - openapi
      # リクエスト ID の採番 (ADR 0010 の 4-1)
      - uuid
    mayDependOn:
      - thread-usecase
      - comment-usecase
      - user-usecase
      - user-model
      - image-usecase
      - httpapi-oapigen
      - shared-config

  # アダプタは外側なので、内側 (domain) を知ってよい
  postgres:
    canUse:
      - pgx
      - uuid
    mayDependOn:
      - thread-model
      - thread-repository
      - comment-model
      - comment-repository
      - user-model
      - user-repository
      - image-model
      - image-repository
      - postgres-sqlcgen
      - shared-config

  # 生成物。import は生成器が決めるので、必要なベンダだけ許可する
  httpapi-oapigen:
    canUse:
      - gin
      - openapi
  postgres-sqlcgen:
    canUse:
      - pgx
      - uuid
