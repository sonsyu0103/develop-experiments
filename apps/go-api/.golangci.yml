version: "2"

linters:
  # standard = errcheck, govet, ineffassign, staticcheck, unused
  default: standard
  enable:
    # HTTP レスポンスボディの閉じ忘れ (接続リーク) を検出する
    - bodyclose
    # errors.Is / errors.As を使わない型アサーションや == 比較を検出する。
    # apperr の番兵エラーを errors.Is で判定する設計なので、これは必須
    - errorlint
    # エラーを受け取っておきながら nil を返している箇所を検出する
    - nilerr
    # context を渡すべき箇所で渡していない HTTP/SQL 呼び出しを検出する
    - noctx
    # 典型的なセキュリティ問題 (弱い乱数、パーミッション、SQL 組み立てなど)
    - gosec
    # database/sql の Rows.Err() 確認漏れ
    - rowserrcheck
    # Rows / Stmt の閉じ忘れ
    - sqlclosecheck
    # 不要な型変換
    - unconvert
    # 代入したのに使われていない値
    - wastedassign
    # コメントや文字列のスペルミス
    - misspell
    # 命名規則、エクスポート識別子のコメント有無など
    - revive
    # モジュール境界とレイヤの依存方向を強制する。
    # 規約のままでは規模が増えたときに必ず崩れるので CI で落とす。
    # 設計の背景は docs/adr/0004-modular-monolith.md
    - depguard

  settings:
    depguard:
      rules:
        # thread モジュールの内側から外を見ない (本体のコード)
        thread-module:
          files:
            - "**/internal/thread/**"
            - "!$test"
          deny:
            - pkg: develop-experiments/apps/go-api/internal/comment
              desc: >-
                モジュール境界の違反。相手モジュールを直接 import せず、
                必要な操作だけのインターフェースを自モジュール側に定義して
                cmd/api で実装を注入する
                (例: comment/domain/repository.ThreadExistenceChecker)
            - pkg: develop-experiments/apps/go-api/internal/httpapi
              desc: 依存方向の違反。HTTP 層はモジュールの外側なので内側からは見えない
            - pkg: develop-experiments/apps/go-api/internal/infrastructure
              desc: 依存方向の違反。永続化層は domain/repository のインターフェース経由で使う
            - pkg: github.com/jackc/pgx
              desc: DB ドライバの漏れ。SQL に依存する処理は infrastructure/postgres に置く
            - pkg: github.com/gin-gonic/gin
              desc: Web フレームワークの漏れ。context.Context と素の値で受ける

        # comment モジュールの内側から外を見ない (thread-module の対称形)
        comment-module:
          files:
            - "**/internal/comment/**"
            - "!$test"
          deny:
            - pkg: develop-experiments/apps/go-api/internal/thread
              desc: >-
                モジュール境界の違反。相手モジュールを直接 import せず、
                必要な操作だけのインターフェースを自モジュール側に定義して
                cmd/api で実装を注入する
                (例: comment/domain/repository.ThreadExistenceChecker)
            - pkg: develop-experiments/apps/go-api/internal/httpapi
              desc: 依存方向の違反。HTTP 層はモジュールの外側なので内側からは見えない
            - pkg: develop-experiments/apps/go-api/internal/infrastructure
              desc: 依存方向の違反。永続化層は domain/repository のインターフェース経由で使う
            - pkg: github.com/jackc/pgx
              desc: DB ドライバの漏れ。SQL に依存する処理は infrastructure/postgres に置く
            - pkg: github.com/gin-gonic/gin
              desc: Web フレームワークの漏れ。context.Context と素の値で受ける

        # domain 層は usecase 層を知らない。
        # モジュールの外側は上の 2 ルールで塞いであるので、
        # ここで塞ぐのは同一モジュール内の domain -> usecase だけ
        domain-layer:
          files:
            - "**/internal/*/domain/**"
          deny:
            - pkg: develop-experiments/apps/go-api/internal/thread/usecase
              desc: 依存方向の違反。domain は usecase を知らない
            - pkg: develop-experiments/apps/go-api/internal/comment/usecase
              desc: 依存方向の違反。domain は usecase を知らない

        # モジュール内のテストコードへの緩和。
        #
        # files の複数パターンは AND ではなく OR で評価されるため、
        # 「モジュール配下 かつ テスト」は 1 ルールでは表現できない。
        # 代わりに、モジュール配下すべてに効く緩いルールとして書く。
        # 非テストのファイルには上の thread-module / comment-module も同時に適用され、
        # そちらの deny の方が広いので、実質「テストにだけ緩和が効く」形になる。
        #
        # 実 DB を使う統合テストを usecase 層に置けるよう infrastructure と pgx は許すが、
        # モジュール境界 (相手モジュール) と HTTP 層は本体と同じく閉じたままにする。
        # 「テストなら何でも import してよい」にすると境界が実質消える。
        #
        # thread 用と comment 用に分けているのは、1 ルールにまとめると
        # deny に両モジュールを並べることになり、自モジュールの参照まで
        # 禁止されてしまうため (thread のテストが thread/domain/model を使えない)。
        thread-module-test:
          files:
            - "**/internal/thread/**"
          deny:
            - pkg: develop-experiments/apps/go-api/internal/comment
              desc: モジュール境界の違反。テストであっても相手モジュールは直接参照しない
            - pkg: develop-experiments/apps/go-api/internal/httpapi
              desc: 依存方向の違反。テストであっても内側から HTTP 層は見えない
            - pkg: github.com/gin-gonic/gin
              desc: Web フレームワークの漏れ。モジュール内のテストに gin は要らない

        comment-module-test:
          files:
            - "**/internal/comment/**"
          deny:
            - pkg: develop-experiments/apps/go-api/internal/thread
              desc: モジュール境界の違反。テストであっても相手モジュールは直接参照しない
            - pkg: develop-experiments/apps/go-api/internal/httpapi
              desc: 依存方向の違反。テストであっても内側から HTTP 層は見えない
            - pkg: github.com/gin-gonic/gin
              desc: Web フレームワークの漏れ。モジュール内のテストに gin は要らない

        # HTTP 層はユースケースだけを見る。
        # ドメインモデルを直接 JSON に晒すと、内部表現が API 契約に漏れる
        # (api/openapi.yaml を単一の正とする ADR 0002 の前提が崩れる)
        httpapi-layer:
          files:
            - "**/internal/httpapi/**"
            - "!$test"
          deny:
            - pkg: develop-experiments/apps/go-api/internal/thread/domain
              desc: >-
                ドメインモデルへの直接参照。usecase の DTO を経由し、
                oapigen の生成型へ詰め替える
            - pkg: develop-experiments/apps/go-api/internal/comment/domain
              desc: >-
                ドメインモデルへの直接参照。usecase の DTO を経由し、
                oapigen の生成型へ詰め替える
            - pkg: develop-experiments/apps/go-api/internal/infrastructure
              desc: 依存方向の違反。永続化層に触れず、必要なら Pinger のような口を切る
            - pkg: github.com/jackc/pgx
              desc: DB ドライバの漏れ。HTTP 層は永続化の実装を知らない

        # HTTP 層のテストへの緩和 (module-test と同じ理由で別ルールにしている)。
        #
        # ハンドラのテストはフェイクのリポジトリを組むためにドメインの型を必要とする。
        # ここを縛るとテストのために本番コードを歪めることになるので domain は許す。
        # 一方で永続化層への直接依存は、テストであっても入口を開けない
        httpapi-test:
          files:
            - "**/internal/httpapi/**"
          deny:
            - pkg: develop-experiments/apps/go-api/internal/infrastructure
              desc: 依存方向の違反。テストであっても HTTP 層から永続化層は見えない
            - pkg: github.com/jackc/pgx
              desc: DB ドライバの漏れ。フェイクのリポジトリで代替する

    errcheck:
      # 型アサーションの失敗も検査する
      check-type-assertions: true
    govet:
      enable:
        # 構造体のフィールド並びによるメモリパディングは
        # 可読性を優先したいので有効にしない (fieldalignment は入れない)
        - shadow
    revive:
      rules:
        - name: exported
          # エクスポートされた識別子にはコメントを求める
          severity: warning
        - name: unexported-return
        - name: error-return
        - name: error-naming
        - name: context-as-argument

  exclusions:
    # sqlc の生成コードは "Code generated ... DO NOT EDIT." を持つので
    # 既定の generated 除外規則で対象外になる
    generated: lax
    rules:
      # テストでは以下を許容する
      - path: _test\.go
        linters:
          - gosec
          - errcheck
      # 生成コードは対象外
      - path: internal/infrastructure/postgres/sqlcgen/
        linters:
          - revive
          - errorlint

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - develop-experiments/apps/go-api
