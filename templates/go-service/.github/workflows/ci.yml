name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # **patch まで固定する。** Dockerfile と go.mod の toolchain と揃える。
  GO_VERSION: '1.26.11'
  # Makefile と同じ版。@latest にしない。
  GOLANGCI_LINT_VERSION: v2.12.2
  GOVULNCHECK_VERSION: v1.9.0

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: 生成物が仕様書と一致するか
        run: make verify-generated
      # **golangci-lint は配布バイナリではなく go install で入れる。**
      # 配布バイナリはビルドした Go より新しい言語版のコードを読めない。
      # GO_VERSION を上げた日に、lint だけが理由の分からない形で落ちる。
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}
          make lint
      - name: test
        run: make test
      # **ツールの版を固定しても脆弱性 DB は古くならない。** DB は実行のたびに
      # vuln.go.dev から取る (-db の既定)。Go 本体の脆弱性でも落ちるので、
      # GO_VERSION を上げる合図にもなる。
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION} ./...

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 本番用イメージのビルド
        run: docker build --target prod -t ci:${{ github.sha }} .

  k8s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: マニフェストが組み立てられるか
        run: kubectl kustomize deploy/k8s > /dev/null
