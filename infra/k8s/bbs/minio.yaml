# MinIO (S3 互換)。compose.yaml の minio / minio-init と同じイメージと初期化。
apiVersion: v1
kind: Service
metadata:
  name: minio
spec:
  selector:
    app.kubernetes.io/name: minio
  ports:
    - name: s3
      port: 9000
      targetPort: s3
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 1
  # **RWO のボリュームを持つので、入れ替えは「止めてから立てる」。**
  # 既定の RollingUpdate だと新旧の Pod が同じボリュームを取り合う。
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
    spec:
      securityContext:
        # bitnami のイメージは UID 1001 で動く。ボリュームを書けるようにする。
        fsGroup: 1001
      containers:
        - name: minio
          image: bitnamilegacy/minio:2025.7.23-debian-12-r5
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef: { name: bbs-credentials, key: MINIO_ROOT_USER }
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: bbs-credentials, key: MINIO_ROOT_PASSWORD }
          ports:
            - name: s3
              containerPort: 9000
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: s3
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - name: data
              mountPath: /bitnami/minio/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-data
---
# バケットを作る Job。compose の minio-init と同じ手順 (冪等)。
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 900
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: mc
          image: bitnamilegacy/minio-client:2025.7.21-debian-12-r3
          command:
            - /bin/sh
            - -c
            # **手順をまるごと、通るまでやり直す** (どれも冪等)。
            #
            # bitnami の MinIO は起動時に、初期設定用の MinIO を裏で立てて止め、
            # 本番の MinIO を立て直す (実測: 起動 0.7 秒で health が 200、5.5 秒で
            # いったん応答しなくなり、その後に本番が上がる)。readinessProbe も
            # 「繋がるまで待つ」も初期設定用のサーバで通ってしまい、続く mc が
            # 入れ替えのすき間に当たると「Connection closed」で落ちる
            # (CI で実際に落ちた)。待ち合わせで当てにいかず、やり直しで吸収する。
            - |
              for i in $(seq 1 60); do
                if mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null 2>&1 &&
                  mc mb --ignore-existing local/bbs-images &&
                  mc anonymous set download local/bbs-images; then
                  exit 0
                fi
                echo "minio の準備を待っています ($i)"; sleep 2
              done
              echo "minio のバケットを作れなかった" >&2
              exit 1
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef: { name: bbs-credentials, key: MINIO_ROOT_USER }
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: bbs-credentials, key: MINIO_ROOT_PASSWORD }
