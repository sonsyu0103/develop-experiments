# **平文の Secret を Git に置いている。** 値は compose.yaml と同じ
# 手元専用の既定値 (password / minioadmin) で、守る対象が無い。
#
# 本物の秘密を載せる日が来たら、ここは Git に置けない。そのときは
# Sealed Secrets か External Secrets Operator に置き換える (ADR 0026 決定 5)。
apiVersion: v1
kind: Secret
metadata:
  name: bbs-credentials
  annotations:
    # Pod より先に作る (値を参照する側が CreateContainerConfigError にならないよう)。
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  POSTGRES_USER: app
  POSTGRES_PASSWORD: password
  DATABASE_URL: postgres://app:password@postgres:5432/bbs?sslmode=disable
  MINIO_ROOT_USER: minioadmin
  MINIO_ROOT_PASSWORD: minioadmin
