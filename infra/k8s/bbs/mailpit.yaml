# Mailpit (SMTP を受けて捨てる)。お問い合わせの送信先。
# 画面を見たいとき: kubectl -n bbs port-forward svc/mailpit 8025
apiVersion: v1
kind: Service
metadata:
  name: mailpit
spec:
  selector:
    app.kubernetes.io/name: mailpit
  ports:
    - name: smtp
      port: 1025
      targetPort: smtp
    - name: http
      port: 8025
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mailpit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mailpit
    spec:
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.21.8
          # compose.yaml の mailpit と同じ (メモリだけに溜め、認証なしで受ける)。
          env:
            - name: MP_MAX_MESSAGES
              value: "500"
            - name: MP_SMTP_AUTH_ACCEPT_ANY
              value: "true"
            - name: MP_SMTP_AUTH_ALLOW_INSECURE
              value: "true"
          ports:
            - name: smtp
              containerPort: 1025
            - name: http
              containerPort: 8025
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
