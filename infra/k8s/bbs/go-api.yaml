# go-api。Dockerfile の prod ステージ (distroless) を動かす。
#
# **イメージは make k8s-images が手元でビルドし、kind に直接読み込む。**
# レジストリを経由しないので、タグは固定 (:local)、pullPolicy は Never。
# イメージの更新を Git に載せる仕組み (タグの書き換えコミット) は持たない
# —— ADR 0026 決定 4。
apiVersion: v1
kind: Service
metadata:
  name: go-api
spec:
  selector:
    app.kubernetes.io/name: go-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-api
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  # ECS (infra/terraform/ecs.tf) と同じ 1 台。
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: go-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: go-api
    spec:
      containers:
        - name: go-api
          image: bbs/go-api:local
          imagePullPolicy: Never
          env:
            # **production で動かす。** development の緩いモード
            # (COMMENT_POST_MODE=naive など) は選べなくなり、
            # Cookie には Secure が付く (SECURE_COOKIE の既定)。
            - name: ENV
              value: production
            - name: LOG_FORMAT
              value: json
            - name: ADDR
              value: ":8080"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: bbs-credentials, key: DATABASE_URL }
            # 単一オリジン (エッジの http://localhost:8088) なので CORS は実質不要。
            # 書き込みは csrfGuard の selfOrigin 一致で通る —— X-Forwarded-Proto が要。
            - name: CORS_ALLOWED_ORIGINS
              value: http://localhost:8088
            # エッジ (Caddy の Pod) は Pod の CIDR から来る (kind-cluster.yaml)。
            - name: TRUSTED_PROXIES
              value: 10.244.0.0/16
            # **Cookie の Secure を外す。** このエッジは TLS を終端しない (http)。
            # Secure 付きの Cookie を http://localhost で受けるかはブラウザ次第で、
            # 受けないブラウザではログインだけが黙って失敗する (レビュー指摘)。
            # Secure を付ける分岐は compose 側の make https-verify が実測している
            # (ADR 0023 決定 3 で SECURE_COOKIE を ENV から独立させたのはこのため)。
            - name: SECURE_COOKIE
              value: "false"
            - name: AUTH_REDIRECT_URL
              value: http://localhost:8088/api/auth/google/callback
            - name: AUTH_FRONTEND_URL
              value: http://localhost:8088
            - name: S3_BUCKET
              value: bbs-images
            - name: S3_REGION
              value: ap-northeast-1
            - name: S3_ENDPOINT
              value: http://minio:9000
            - name: S3_USE_PATH_STYLE
              value: "true"
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: { name: bbs-credentials, key: MINIO_ROOT_USER }
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: bbs-credentials, key: MINIO_ROOT_PASSWORD }
            - name: S3_PUBLIC_BASE_URL
              value: http://localhost:8088/images
            - name: MAIL_SMTP_HOST
              value: mailpit
            - name: MAIL_SMTP_PORT
              value: "1025"
            - name: MAIL_SMTP_STARTTLS
              value: "false"
            - name: MAIL_FROM
              value: contact@bbs.example.com
            - name: MAIL_TO
              value: ops@bbs.example.com
          ports:
            - name: http
              containerPort: 8080
          # **生存は /healthz (DB を見ない)、受付可否は /readyz (DB を見る)。**
          # 生存に DB を混ぜると、DB の瞬断で Pod が再起動ループに入る
          # (httpapi/server.go の GetHealthz のコメントと同じ理由)。
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            # **ルートを読み取り専用にするなら /tmp は書けるようにする。**
            # 画像のアップロードは 1 MiB を超えた分を一時ファイルに書く
            # (images.go の multipartMemoryLimit。上限は 5 MiB)。/tmp が書けないと、
            # 2〜5 MiB の画像だけが k8s でだけ失敗する (レビュー指摘)。
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            # **UID を数字で書く。** Dockerfile は USER nonroot:nonroot (名前) なので、
            # kubelet はイメージを見ても root でないと確かめられず、
            # runAsNonRoot だけだと CreateContainerConfigError で止まる。
            # 65532 は distroless の nonroot の UID。
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir:
            # アップロードの上限 (5 MiB) × 同時数に余裕を持たせる。
            sizeLimit: 64Mi
