# 掲示板を Git の infra/k8s/bbs に揃え続ける Application (ADR 0026)。
#
# **見る枝は develop。** PR がマージされた枝にクラスタが追従する。
#
# 初版は main にしていた (「何が出ているか」を main で読めるように)。
# だが main への反映はリリースの PR を待つので、マージ直後の
# make k8s-up は「main に infra/k8s が無い」で同期できずに止まる (レビュー指摘)。
# このクラスタは手元の開発用で、本番 (main → ECS) とは別の役割になる。
# 作業ブランチを試すときは、Git を書き換えずに上書きする:
#   make k8s-up K8S_REVISION=feat/xxx
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bbs
  namespace: argocd
  # Application を消したら、配ったリソースも消す。
  # これが無いと、Application を消してもクラスタに掲示板が残り続ける。
  #
  # apply すると Kubernetes v1.37 が「prefer a domain-qualified finalizer name
  # including a path (/)」と警告するが、**名前は Argo CD の公式どおりにする。**
  # Argo CD が認める「/ 付き」は .../background だけで、それは削除の方式
  # (前景 → 背景) を変えてしまう。警告のために挙動を変えない。
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/sonsyu0103/develop-experiments.git
    targetRevision: develop
    path: infra/k8s/bbs
  destination:
    server: https://kubernetes.default.svc
    namespace: bbs
  syncPolicy:
    automated:
      # Git から消したものはクラスタからも消す。
      prune: true
      # **クラスタを手で変えても Git に戻す。** これを外すと「Git と違う」と
      # 表示されるだけで、kubectl scale や edit がそのまま残る。
      selfHeal: true
    retry:
      # 初回はイメージの読み込みや postgres の起動を待つので、何度かやり直させる。
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m
