apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
data:
  # **kustomize のファイル読み込み制限を外す。**
  # bbs/kustomization.yaml はマイグレーションや Caddyfile をリポジトリの正本から
  # 読む (コピーしない) ため、kustomization のあるディレクトリの外に出る。
  # 既定の LoadRestrictionsRootOnly のままだと、手元の make k8s-render は通るのに
  # Argo CD だけが ComparisonError で止まる (手元にも同じフラグを付けているため)。
  kustomize.buildOptions: --load-restrictor LoadRestrictionsNone
  # Git を見に行く間隔。既定 (3 分) では、push してから反映されるまでを
  # 確かめるのに待ちすぎる。手元の検証用なので短くする。
  timeout.reconciliation: 60s
