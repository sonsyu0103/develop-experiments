# Fluent Bit の設定 (docs/adr/0010-log-pipeline.md)。
#
# 【本番との関係】
# 本番は ECS の FireLens がサイドカーとして fluent-bit を動かし、
# タスク定義の logDriver に awsfirelens を指定する。ローカルは compose の
# fluentd ログドライバで forward プロトコルに載せる。
#
# **どちらの経路でも、アプリの 1 行は log キーの「文字列」として届く。**
# だからこの設定ファイルは両方で同じものが使える。
# 差分は出力先のエンドポイント (と、下の SERVICE の Flush 間隔) だけになる。
#
#   本番     : go-api ─stdout→ FireLens ─┬→ S3
#                                        └→ CloudWatch Logs (7 日)
#   ローカル : go-api ─forward→ fluent-bit ─┬→ MinIO
#                                           └→ stdout (CloudWatch の代役)

[SERVICE]
    # ローカルは目視で確認したいので 1 秒で流す。
    # 本番のフラッシュ間隔はバッファのメモリ量と往復回数の兼ね合いで決める。
    Flush        1
    Daemon       Off
    Log_Level    ${FB_LOG_LEVEL}
    Parsers_File parsers.conf
    # 設定ミスで起動できないときに黙って落ちないようにする。
    # (health エンドポイントは compose の healthcheck が叩く)
    HTTP_Server  On
    HTTP_Listen  0.0.0.0
    HTTP_Port    2020

[INPUT]
    Name          forward
    Listen        0.0.0.0
    Port          24224
    # **溢れたら捨てる。** ログのために API を止めない。
    # ADR 0010 決定 5 で「ログは at-most-once であり、欠落しうる」と
    # 決めているので、ここで背圧をかけてアプリ側を待たせる選択は採らない。
    Mem_Buf_Limit 16MB

# FireLens / fluentd ドライバが包んだ JSON を展開する (ADR 0010 の「罠」)。
#
# 展開しないと S3 のレコードはこうなる:
#   {"log": "{\"time\":\"...\",\"msg\":\"http_request\"}", "container_id": "..."}
#
# Athena からは 1 本の文字列にしか見えず、json_extract を毎回書くことになる。
[FILTER]
    Name         parser
    Match        *
    Key_Name     log
    Parser       json
    # コンテナのメタデータ (container_id / container_name) を残す。
    # 落とすと、どのコンテナが出したログか分からなくなる。
    Reserve_Data On

# 【JSON でない行はどうなるか】
# パースに失敗したレコードは、**破棄されず log キーのまま素通しする**
# (Reserve_Data On の効果)。go run のコンパイルエラーや panic の
# スタックトレースは JSON ではないので、この経路で S3 に着地する。
# msg が無い行として残るため、Athena では msg IS NULL で拾える。

# CloudWatch Logs の代役 (ADR 0010 決定 1)。
#
# **これが無いと `docker compose logs go-api` が空になる。**
# fluentd ログドライバは stdout を横取りするので、
# アプリのログはもう go-api コンテナのログには出ない。
# 障害時にリアルタイムで追える経路を 1 本残す、という決定 1 の
# 「CloudWatch を完全に捨てない理由」が、そのままローカルにも当てはまる。
[OUTPUT]
    Name   stdout
    Match  *
    Format json_lines

[OUTPUT]
    Name             s3
    Match            *
    bucket           ${LOG_BUCKET}
    region           ${AWS_REGION}
    # 実 S3 では endpoint を空にする。MinIO のときだけ指定する
    # (go-api の S3_ENDPOINT と同じ考え方)。
    endpoint         ${LOG_S3_ENDPOINT}
    compression      gzip
    # **PutObject を使う。** 既定はマルチパートアップロードで、
    # total_file_size に達するまでオブジェクトが「完成」しない。
    # 手元で 1 分待って確認したい用途に向かない。
    # ADR 0010 決定 6 が「未完了のマルチパートを 7 日で中止する」
    # ライフサイクルを要求しているのも、この方式を避けた場合の話になる。
    use_put_object   On
    total_file_size  ${LOG_TOTAL_FILE_SIZE}
    upload_timeout   ${LOG_UPLOAD_TIMEOUT}
    # Hive 形式。Athena の partition projection がこの規則性だけに依存する
    # (ADR 0010 決定 2)。**$UUID は fluent-bit が展開する予約語**であり、
    # シェルの変数ではない。
    s3_key_format    /logs/service=go-api/dt=%Y-%m-%d/hour=%H/$UUID.json.gz
    # **キーの時刻はコンテナの TZ に従う。** dt/hour を UTC に固定するため、
    # compose 側で TZ=UTC を渡している (fluent-bit 自身に UTC 指定は無い)。
    # ここがずれると、Athena の partition projection の範囲と
    # レコード内の time (UTC 固定) が 9 時間ずれた形で噛み合わなくなる。
    #
    # チャンクを送信順に処理する。順序が入れ替わっても Athena では
    # time で並べ直せるが、S3 に落ちたファイルを目で追うときに効く。
    preserve_data_ordering On
    # **fluent-bit が独自の時刻フィールドを足さないようにする。**
    # 既定では date キーが増える。go-api は既に time を出しており
    # (ADR 0010 の 4-2)、両方あると「どちらで絞るのか」が毎回問題になる。
    # 消えて困る情報ではない —— date はフラッシュ時刻であり、
    # 同じものが S3 のキー (dt/hour) に既に入っている。
    json_date_key    false
    # 送信に失敗したチャンクを捨てるまでの再試行回数。
    # 無制限にすると MinIO が落ちている間にバッファを食い潰す。
    Retry_Limit      3
