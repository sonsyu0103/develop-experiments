# Fluent Bit のパーサ定義 (docs/adr/0010-log-pipeline.md の「罠」節)。
#
# **json パーサは fluent-bit に組み込みで存在しない。** ここで定義する。
# 定義せずに [FILTER] parser で Parser json を指定すると、
# fluent-bit は起動時に "parser 'json' not found" で終了する。

[PARSER]
    Name        json
    Format      json
    # Time_Key を指定しない理由:
    #
    # go-api のログは time を RFC3339 (UTC) で出しており
    # (internal/logging の toUTC)、ここで Time_Key time を書くと
    # **レコードの time がタイムスタンプとして消費され、出力から消える。**
    # S3 に着地した JSON から time が無くなり、ADR 0010 の 4-2 で
    # 「全ログに必ず含める」と決めた最小集合が崩れる。
    #
    # パーティションのキーはどのみちフラッシュ時刻から決まるので
    # (決定 2 の「罠」)、レコード側の時刻を fluent-bit に解釈させる
    # 利点が無い。time は**ただの文字列フィールドとして素通しする**。
