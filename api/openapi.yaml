# =============================================================================
# 掲示板 API の仕様書。
#
# 【このファイルが「正」です】
# ここを手で編集し、そこから以下を自動生成します。
#
#   api/openapi.yaml
#        ├── oapi-codegen ──────→ apps/go-api/internal/httpapi/oapigen/  (Go)
#        └── openapi-typescript ─→ apps/next-app/schema.d.ts             (TS)
#
# Go のハンドラは生成された ServerInterface を実装するため、
# 仕様に無いエンドポイントは実装できず、実装漏れはコンパイルエラーになります。
#
# 編集したら `make generate` を実行してください。
# CI が再生成して差分を検査するため、忘れるとビルドが落ちます。
# =============================================================================
openapi: 3.0.3

info:
  title: Develop Experiments API
  version: 1.0.0
  description: |
    掲示板 API。スレッドとコメントの取得・投稿を提供します。

    一覧系はすべてキーセット (cursor) ページネーションです。
    OFFSET を使わないのは、深いページほど線形に遅くなることと、
    ページ送り中の挿入で行の重複・取りこぼしが起きるためです。

    カーソルは不透明トークンです。中身は実装詳細なので、
    クライアントは `nextCursor` をそのまま `cursor` に渡してください。

servers:
  - url: http://localhost:8080
    description: ローカル開発環境

tags:
  - name: health
    description: 死活監視
  - name: auth
    description: 認証 (Google OIDC)
  - name: threads
    description: スレッド
  - name: comments
    description: コメント

paths:
  /auth/google:
    get:
      operationId: startGoogleLogin
      tags: [auth]
      summary: Google へのログインを開始する
      description: |
        Google の認可エンドポイントへリダイレクトします。

        state / nonce / PKCE の code_verifier をサーバ側で生成し、
        短命な Cookie に保存します。CSRF とトークン差し替えを防ぐため、
        コールバックではこれらを必ず照合します。
      responses:
        '302':
          description: Google の認可エンドポイントへリダイレクト
          headers:
            Location:
              schema:
                type: string
              description: accounts.google.com の認可 URL
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/google/callback:
    get:
      operationId: googleLoginCallback
      tags: [auth]
      summary: Google からのコールバックを受ける
      description: |
        認可コードをトークンへ交換し、ID トークンを検証してから
        セッションを発行します。成功するとフロントエンドへリダイレクトし、
        セッション ID を HttpOnly Cookie で返します。

        退会済みの利用者が同じ Google アカウントで再ログインした場合は
        401 になります。行を復活させるかは未決です
        (docs/adr/0005-authentication.md)。

        同意画面で拒否された場合、Google は code を付けずに
        error だけを返します。この経路もフロントエンドへリダイレクトし、
        API のエラー JSON をブラウザに直接見せません。
      parameters:
        - name: state
          in: query
          required: true
          description: |
            開始時に発行した state。Cookie の値と照合します。
            拒否された場合も Google はこれを返すため、必須にしています
          schema:
            type: string
            maxLength: 512
        - name: code
          in: query
          required: false
          description: |
            Google が発行した認可コード。
            **同意画面で拒否されたときは付きません** (代わりに error が付きます)。
            必須にすると、拒否した利用者に検証エラーの JSON が直接見えてしまいます
          schema:
            type: string
            maxLength: 2048
        - name: error
          in: query
          required: false
          description: |
            拒否や設定不備のときに Google が返すエラー識別子
            (access_denied など)
          schema:
            type: string
            maxLength: 256
      responses:
        '302':
          description: フロントエンドへリダイレクト
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              schema:
                type: string
              description: セッション ID (HttpOnly)
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: ログアウトする
      description: |
        サーバ側のセッションを削除し、Cookie を破棄します。

        セッションの実体を DB に持つため、ログアウトは即座に効きます。
        ステートレスな JWT ではこれができません
        (docs/adr/0005-authentication.md 決定 1)。
      security:
        - sessionCookie: []
      responses:
        '204':
          description: ログアウトした
          headers:
            Set-Cookie:
              schema:
                type: string
              description: 空値・有効期限切れの Cookie
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /me:
    get:
      operationId: getMe
      tags: [auth]
      summary: ログイン中の利用者を取得する
      description: |
        セッションが有効な場合にだけ 200 を返します。

        内部 ID (`users.id`) は返しません。API が扱う識別子は `publicId` だけです
        (docs/adr/0003-open-questions.md 未決 #11)。
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /healthz:
    get:
      operationId: getHealthz
      tags: [health]
      summary: Liveness プローブ
      description: |
        プロセスが生きているかだけを返します。DB の状態は見ません。
        ここで DB を見ると、DB の一時的な不調でコンテナが再起動ループに入ります。
      responses:
        '200':
          description: 正常
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  /readyz:
    get:
      operationId: getReadyz
      tags: [health]
      summary: Readiness プローブ
      description: DB への疎通を含め、リクエストを受けられる状態かを返します。
      responses:
        '200':
          description: リクエスト受付可能
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: 依存先が利用できない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  /threads:
    get:
      operationId: listThreads
      tags: [threads]
      summary: スレッド一覧の取得
      description: |
        スレッドを新しい順に、コメント数つきで取得します。

        コメント数は LEFT JOIN と COUNT(*) FILTER による単一クエリで集計しています。
        スレッドごとに COUNT を投げる実装 (N+1) を goroutine で並列化しても
        DB へのラウンドトリップ回数は減らないため、単一クエリのほうが有利です。
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      operationId: createThread
      tags: [threads]
      summary: スレッドの作成
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateThreadRequest'
      responses:
        '201':
          description: 作成成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Thread'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /threads/{threadId}:
    parameters:
      - $ref: '#/components/parameters/ThreadId'
    get:
      operationId: getThread
      tags: [threads]
      summary: スレッドの取得
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Thread'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /threads/{threadId}/comments:
    parameters:
      - $ref: '#/components/parameters/ThreadId'
    get:
      operationId: listComments
      tags: [comments]
      summary: コメント一覧の取得
      description: |
        指定スレッドのコメントを新しい順に取得します。

        comments テーブルは thread_id による HASH パーティションなので、
        thread_id を等値指定するこのクエリでは partition pruning が効き、
        8 分割中 1 パーティションのみを走査します。
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      operationId: createComment
      tags: [comments]
      summary: コメントの投稿
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequest'
      responses:
        '201':
          description: 投稿成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: 親スレッドが存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            同時更新が競合しました。再試行可能です。
            SERIALIZABLE 分離レベルでの直列化失敗 (SQLSTATE 40001) や
            デッドロック (40P01) がここに対応します。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: |
        ログイン時に発行される HttpOnly Cookie。

        **`security` を宣言したオペレーションだけが認証必須です。**
        匿名投稿を残す設計 (docs/adr/0005-authentication.md 決定 2) のため、
        スレッド作成やコメント投稿には宣言していません。
        OpenAPI の `security` は「必須」しか表現できず、
        「ログインしていれば投稿者を紐付ける」という任意認証は書けないためです。
        任意認証はハンドラ側で扱います。

  parameters:
    ThreadId:
      name: threadId
      in: path
      required: true
      description: スレッド ID
      schema:
        type: integer
        format: int64
        minimum: 1

    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        次ページの取得位置を表す不透明トークン。
        直前のレスポンスの `nextCursor` をそのまま渡します。
        省略した場合と空文字を渡した場合は、どちらも先頭ページになります。

        中身はサーバ側の実装詳細なので、
        **クライアントは解釈も生成も改変もしないでください。**
        並び順を追加してもこの型は変わりません
        (docs/adr/0018-opaque-cursor.md)。
      schema:
        type: string
        # base64url (パディングなし) なので、この文字集合に収まる。
        # 空文字を許すのは、クライアントが ?cursor=${nextCursor ?? ''} と
        # 組み立てたときに初回ロードだけ 400 になるのを避けるため。
        # 長さの上限がないと、巨大な文字列を復号させられる。
        pattern: '^[A-Za-z0-9_-]*$'
        maxLength: 256
        example: eyJ2IjoxLCJpZCI6NDJ9

    Size:
      name: size
      in: query
      required: false
      description: |
        取得件数。省略時は 20。
        上限を設けないと、1 リクエストで全件走査させられてしまいます。
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20

  responses:
    BadRequest:
      description: リクエストが不正
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: 対象が存在しない
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Unauthorized:
      description: 未ログイン、またはセッションが無効
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    ServiceUnavailable:
      description: |
        認証プロバイダの設定が入っていないため、この経路は利用できません。
        設定が無くても API 自体は起動します
        (掲示板の閲覧と匿名投稿は認証に依存しないため)。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    InternalError:
      description: サーバ内部エラー
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
        reason:
          type: string
          description: 異常時のみ設定されます
          example: database

    Thread:
      type: object
      required: [id, title, commentCount, author, createdAt]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        title:
          type: string
          example: Go の並列処理を学ぶ部屋
        commentCount:
          type: integer
          format: int64
          description: 論理削除されていないコメントの件数
          example: 7
        author:
          $ref: '#/components/schemas/Author'
        createdAt:
          type: string
          format: date-time
          example: '2026-08-02T12:00:00Z'

    Comment:
      type: object
      required: [id, threadId, authorName, author, body, createdAt]
      properties:
        id:
          type: integer
          format: int64
          example: 10
        threadId:
          type: integer
          format: int64
          example: 1
        authorName:
          type: string
          description: |
            匿名投稿の表示名。省略時は「名無しさん」になります。

            **`author` があるときは、そちらを表示してください。**
            ログイン中の投稿ではこの欄は既定値のまま保存されます
            (表示名の変更を過去の投稿にも反映させるため。ADR 0014)。
          example: 名無しさん
        author:
          $ref: '#/components/schemas/Author'
        body:
          type: string
          example: ふぁ〜、眠いよ〜
        createdAt:
          type: string
          format: date-time
          example: '2026-08-02T12:00:00Z'

    ThreadList:
      type: object
      required: [threads, nextCursor]
      properties:
        threads:
          type: array
          items:
            $ref: '#/components/schemas/Thread'
        nextCursor:
          $ref: '#/components/schemas/NextCursor'

    CommentList:
      type: object
      required: [comments, nextCursor]
      properties:
        comments:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
        nextCursor:
          $ref: '#/components/schemas/NextCursor'

    NextCursor:
      type: string
      nullable: true
      description: |
        次ページ取得用の不透明トークン。これ以上ページがない場合は null。
        `cursor` パラメータへそのまま渡してください。
      example: eyJ2IjoxLCJpZCI6NDJ9

    CreateThreadRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: DB 側の CHECK 制約 threads_title_length と同じ上限です
          example: 新しいスレッド

    Author:
      type: object
      nullable: true
      required: [displayName, withdrawn]
      description: |
        投稿者。**匿名投稿では `null` になります**
        (docs/adr/0005-authentication.md 決定 2)。

        内部 ID (`users.id`) は含めません。`Me` と同じ理由です。

        退会した利用者の投稿は、投稿そのものは残したまま表示だけ差し替えます。
        このとき `publicId` を返しません —— フロントが `withdrawn` の分岐を
        落としても、退会した人のマイページへ辿れないようにするためです。
      properties:
        publicId:
          type: string
          format: uuid
          description: |
            公開用の識別子 (UUID v7)。

            **退会済みの場合はフィールドごと省略されます** (null ではありません)。
            required に入れていないため、生成される型は省略可能になります
          example: 0192f0a0-0000-7000-8000-000000000001
        displayName:
          type: string
          description: 退会済みの場合は「退会したユーザー」に置き換わります
          example: ホシノ
        avatarUrl:
          type: string
          nullable: true
          description: |
            アバター画像の URL。

            **未設定または退会済みの場合はフィールドごと省略されます**
            (`Me.avatarUrl` と同じ挙動)。null が入って返ることはありません
          example: https://lh3.googleusercontent.com/a/xxxx
        withdrawn:
          type: boolean
          description: 退会済みか
          example: false

    Me:
      type: object
      required: [publicId, displayName, email]
      description: |
        ログイン中の利用者。

        **内部 ID (`users.id`) は含めません。** マイページの URL が連番だと
        全ユーザーを列挙できるため、API が扱う識別子は `publicId` だけです
        (docs/adr/0003-open-questions.md 未決 #11)。
      properties:
        publicId:
          type: string
          format: uuid
          description: 公開用の識別子 (UUID v7)
          example: 0192f0a0-0000-7000-8000-000000000001
        displayName:
          type: string
          example: ホシノ
        email:
          type: string
          description: 本人にだけ返します。投稿一覧には含まれません
          example: hoshino@example.com
        avatarUrl:
          type: string
          nullable: true
          example: https://lh3.googleusercontent.com/a/xxxx

    CreateCommentRequest:
      type: object
      required: [body]
      properties:
        authorName:
          type: string
          maxLength: 50
          description: |
            匿名投稿の表示名。省略時は「名無しさん」になります。

            **ログイン中は無視されます。** 表示名は `users` 側から解決するため、
            送っても保存されず、レスポンスの `authorName` は既定値のままになります
            (表示名の変更を過去の投稿にも反映させるため。ADR 0014)。
            エラーにはしません
          example: ホシノ
        body:
          type: string
          minLength: 1
          maxLength: 2000
          example: ふぁ〜、眠いよ〜

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: 機械可読なエラー種別。クライアントはこの値で分岐します。
              enum:
                - INVALID_ARGUMENT
                - UNAUTHENTICATED
                - NOT_FOUND
                - METHOD_NOT_ALLOWED
                - CONFLICT
                - UNAVAILABLE
                - INTERNAL
              example: NOT_FOUND
            message:
              type: string
              description: 人間向けの説明。文言は予告なく変わるため分岐に使わないでください。
              example: 対象のリソースが見つかりません
