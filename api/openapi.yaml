# =============================================================================
# 掲示板 API の仕様書。
#
# 【このファイルが「正」です】
# ここを手で編集し、そこから以下を自動生成します。
#
#   api/openapi.yaml
#        ├── oapi-codegen ──────→ apps/go-api/internal/httpapi/oapigen/  (Go)
#        └── openapi-typescript ─→ apps/next-app/schema.d.ts             (TS)
#
# Go のハンドラは生成された ServerInterface を実装するため、
# 仕様に無いエンドポイントは実装できず、実装漏れはコンパイルエラーになります。
#
# 編集したら `make generate` を実行してください。
# CI が再生成して差分を検査するため、忘れるとビルドが落ちます。
# =============================================================================
openapi: 3.0.3

info:
  title: Develop Experiments API
  version: 1.0.0
  description: |
    掲示板 API。スレッドとコメントの取得・投稿を提供します。

    一覧系はすべてキーセット (cursor) ページネーションです。
    OFFSET を使わないのは、深いページほど線形に遅くなることと、
    ページ送り中の挿入で行の重複・取りこぼしが起きるためです。

    カーソルは不透明トークンです。中身は実装詳細なので、
    クライアントは `nextCursor` をそのまま `cursor` に渡してください。

servers:
  - url: http://localhost:8080
    description: ローカル開発環境

tags:
  - name: health
    description: 死活監視
  - name: auth
    description: 認証 (Google OIDC)
  - name: threads
    description: スレッド
  - name: comments
    description: コメント
  - name: images
    description: 画像
  - name: moderation
    description: モデレーション (docs/adr/0011-moderation.md)

paths:
  /auth/google:
    get:
      operationId: startGoogleLogin
      tags: [auth]
      summary: Google へのログインを開始する
      description: |
        Google の認可エンドポイントへリダイレクトします。

        state / nonce / PKCE の code_verifier をサーバ側で生成し、
        短命な Cookie に保存します。CSRF とトークン差し替えを防ぐため、
        コールバックではこれらを必ず照合します。
      responses:
        '302':
          description: Google の認可エンドポイントへリダイレクト
          headers:
            Location:
              schema:
                type: string
              description: accounts.google.com の認可 URL
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/google/callback:
    get:
      operationId: googleLoginCallback
      tags: [auth]
      summary: Google からのコールバックを受ける
      description: |
        認可コードをトークンへ交換し、ID トークンを検証してから
        セッションを発行します。成功するとフロントエンドへリダイレクトし、
        セッション ID を HttpOnly Cookie で返します。

        退会済みの利用者が同じ Google アカウントで再ログインした場合は
        401 になります。行を復活させるかは未決です
        (docs/adr/0005-authentication.md)。

        同意画面で拒否された場合、Google は code を付けずに
        error だけを返します。この経路もフロントエンドへリダイレクトし、
        API のエラー JSON をブラウザに直接見せません。
      parameters:
        - name: state
          in: query
          required: true
          description: |
            開始時に発行した state。Cookie の値と照合します。
            拒否された場合も Google はこれを返すため、必須にしています
          schema:
            type: string
            maxLength: 512
        - name: code
          in: query
          required: false
          description: |
            Google が発行した認可コード。
            **同意画面で拒否されたときは付きません** (代わりに error が付きます)。
            必須にすると、拒否した利用者に検証エラーの JSON が直接見えてしまいます
          schema:
            type: string
            maxLength: 2048
        - name: error
          in: query
          required: false
          description: |
            拒否や設定不備のときに Google が返すエラー識別子
            (access_denied など)
          schema:
            type: string
            maxLength: 256
      responses:
        '302':
          description: フロントエンドへリダイレクト
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              schema:
                type: string
              description: セッション ID (HttpOnly)
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: ログアウトする
      description: |
        サーバ側のセッションを削除し、Cookie を破棄します。

        セッションの実体を DB に持つため、ログアウトは即座に効きます。
        ステートレスな JWT ではこれができません
        (docs/adr/0005-authentication.md 決定 1)。
      security:
        - sessionCookie: []
      responses:
        '204':
          description: ログアウトした
          headers:
            Set-Cookie:
              schema:
                type: string
              description: 空値・有効期限切れの Cookie
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /me:
    get:
      operationId: getMe
      tags: [auth]
      summary: ログイン中の利用者を取得する
      description: |
        セッションが有効な場合にだけ 200 を返します。

        内部 ID (`users.id`) は返しません。API が扱う識別子は `publicId` だけです
        (docs/adr/0003-open-questions.md 未決 #11)。
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /me/avatar:
    put:
      operationId: setMyAvatar
      tags: [auth]
      summary: プロフィール画像を設定する
      description: |
        `POST /images` で `kind=avatar` として上げた画像を、
        自分のプロフィール画像にします。

        **自分がアップロードした画像だけ**を指定できます。
        他人の画像 ID を指定すると 404 になります (存在を隠すため)。

        `imageId` を `null` にすると設定を外します。
        外すと Google のプロフィール画像 (`users.avatar_url`) に戻ります
        (docs/adr/0007-image-storage.md のスキーマ)。
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [imageId]
              properties:
                imageId:
                  type: string
                  format: uuid
                  nullable: true
                  description: 設定する画像の ID。`null` で解除します。
      responses:
        '200':
          description: 設定した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: |
            指定された画像が存在しないか、自分のものではありません。
            **403 ではなく 404 を返します** —— 403 だと
            「その ID の画像が存在すること」自体が漏れます
            (docs/adr/0013-http-defense.md)。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /images:
    post:
      operationId: uploadImage
      tags: [images]
      summary: 画像をアップロードする
      description: |
        画像を受け取り、**再エンコードしてから**保存します
        (docs/adr/0007-image-storage.md 決定 2)。

        アップロードされたバイト列はそのまま保存されません。
        デコードし、リサイズし、こちらの指定した形式でエンコードし直した
        ものだけを保存します。これ 1 つで MIME 偽装・EXIF の位置情報・
        SVG に埋めたスクリプト・ポリグロットがまとめて閉じます。

        **ログインが必要です。** 匿名で任意のバイト列をストレージに置けると、
        容量の消費と違法コンテンツの設置が追跡不能な形で可能になります。

        **添付は別の操作です。** ここで得た `id` を
        `POST /threads/{threadId}/comments` の `imageId` に渡してください。
        アップロードした時点では、まだどこからも参照されていません。

        入力: JPEG / PNG / WebP。**SVG は受け付けません** ——
        ベクタ形式はスクリプトと外部参照を含められるため、
        「画像」として扱うと XSS と SSRF の経路になります。

        **`Idempotency-Key` は受け付けません。**
        [ADR 0015](../docs/adr/0015-idempotency.md) 決定 2 は画像も対象に
        挙げていますが、同 決定 3 が要求する「キーの確保と応答の記録を
        主トランザクションに同居させる」が、**DB とストレージの
        2 システムにまたがるアップロードでは満たせない**ためです。

        二重アップロードで起きるのは「使われない画像が 1 枚増える」ことだけで、
        コメントの二重投稿のような不可逆な結果にはなりません。
        添付する側 (コメント投稿) の冪等キーは、`imageId` を指紋に含めています。
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, kind]
              properties:
                file:
                  type: string
                  format: binary
                  description: |
                    画像本体。5 MiB まで。

                    デコード後の画素数にも上限があります (2500 万画素)。
                    **サイズの上限だけでは decompression bomb を防げない**ため、
                    全体を展開する前にヘッダから寸法を読んで判定します。
                kind:
                  $ref: '#/components/schemas/ImageKind'
      responses:
        '201':
          description: アップロード成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Image'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          description: |
            サイズまたは画素数の上限を超えました。
            縮小すれば通ります (docs/adr/0007-image-storage.md 決定 2)。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: |
            ストレージの設定が入っていないため、この経路だけが使えません。
            掲示板の閲覧・投稿・ログインは影響を受けません。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /moderation/actions:
    post:
      operationId: createModerationAction
      tags: [moderation]
      summary: モデレーション操作を実行し、記録する
      description: |
        投稿や画像をモデレーターとして削除し、**その事実を DB に記録します**
        (docs/adr/0011-moderation.md 決定 2・3・5)。

        **moderator または admin だけが呼べます。** それ以外は 403 です。

        ### 削除と記録は同じトランザクションで行われます

        [ADR 0010](../docs/adr/0010-log-pipeline.md) が
        「ログは at-most-once であり欠落しうる」と決めているため、
        監査に使う記録をログの件数から数えることはできません。
        `moderation_actions` テーブルが正になります。

        ログにも出しますが、**正はテーブル側**です。

        ### 削除はすべて論理削除です

        行は残ります。モデレーションは判断を伴うので必ず誤操作が起き、
        戻せない削除は運用できません。コメントの参照整合性も保たれます。

        **匿名投稿 (`author_id IS NULL`) も削除できます。**
        [ADR 0005](../docs/adr/0005-authentication.md) の
        「匿名投稿は誰も削除できない」は ADR 0011 が上書きしています。

        ### 画像はストレージからも消えます

        `delete_image` は `images.status` を `'deleted'` にします。
        論理削除だけでは S3 のオブジェクトが残り、
        **URL を直接叩けば見え続ける**ためです。
        実体は回収バッチが消します (ADR 0011 決定 5)。

        **即時ではありません。** 回収バッチの周回間隔ぶん
        (既定 10 分) の遅れがあります。
        CloudFront のキャッシュはさらに残ります。

        ### 同じ対象を 2 回削除すると 404 です

        論理削除は `deleted_at IS NULL` を条件にしているため、
        2 回目は 0 行になります。**記録も残りません** ——
        実際には何も起きていないためです。
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateModerationActionRequest'
      responses:
        '201':
          description: 削除し、記録した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModerationAction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            `code` は `PERMISSION_DENIED` です。原因は 2 つあります。

            - **ロールが `moderator` / `admin` ではない**
              (docs/adr/0011-moderation.md 決定 1)
            - 状態変更メソッドの `Origin` / `Referer` が許可リストに無い
              (docs/adr/0013-http-defense.md 決定 1)

            **ロールの検査は対象を探す前に行います。** 逆にすると、
            権限の無い利用者が 403 と 404 の差で
            「その ID の対象が存在すること」を確かめられます。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: |
            対象が存在しないか、既に削除されています。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /healthz:
    get:
      operationId: getHealthz
      tags: [health]
      summary: Liveness プローブ
      description: |
        プロセスが生きているかだけを返します。DB の状態は見ません。
        ここで DB を見ると、DB の一時的な不調でコンテナが再起動ループに入ります。
      responses:
        '200':
          description: 正常
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  /readyz:
    get:
      operationId: getReadyz
      tags: [health]
      summary: Readiness プローブ
      description: DB への疎通を含め、リクエストを受けられる状態かを返します。
      responses:
        '200':
          description: リクエスト受付可能
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: 依存先が利用できない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  /threads:
    get:
      operationId: listThreads
      tags: [threads]
      summary: スレッド一覧の取得
      description: |
        スレッドを新しい順に、コメント数つきで取得します。

        コメント数は LEFT JOIN と COUNT(*) FILTER による単一クエリで集計しています。
        スレッドごとに COUNT を投げる実装 (N+1) を goroutine で並列化しても
        DB へのラウンドトリップ回数は減らないため、単一クエリのほうが有利です。
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      operationId: createThread
      tags: [threads]
      summary: スレッドの作成
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateThreadRequest'
      responses:
        '201':
          description: 作成成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Thread'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: |
            アイコンを指定したが未ログインです。
            **画像の投稿にはログインが要ります**
            (docs/adr/0007-image-storage.md の背景)。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: |
            指定されたアイコンが存在しないか、自分のものではありません。
            **403 ではなく 404** です —— 403 だと
            「その ID の画像が存在すること」自体が漏れます。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: |
            ストレージの設定が入っていないため、アイコンを指定できません。
            アイコンなしのスレッド作成は影響を受けません。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /threads/{threadId}:
    parameters:
      - $ref: '#/components/parameters/ThreadId'
    get:
      operationId: getThread
      tags: [threads]
      summary: スレッドの取得
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Thread'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      operationId: deleteThread
      tags: [threads]
      summary: 自分のスレッドを削除する
      description: |
        **自分が立てたスレッドだけ**を削除できます
        (docs/adr/0005-authentication.md の権限モデル)。
        [ADR 0003](../docs/adr/0003-open-questions.md) の未決 #7
        (コメント削除 API を公開するか) は、認証が入ったこの時点で解けます。

        論理削除です。行は残り、コメントの参照整合性も保たれます。

        ### 匿名で立てたスレッドは削除できません

        `author_id` が NULL のスレッドは、**投稿者を特定する情報がない**ため
        本人であることを示せません。ログイン後に「さっき匿名で書いたやつ」を
        自分のものにする機能も作りません —— 許すと任意の匿名投稿を
        誰でも自分のものだと主張できます
        (docs/adr/0005-authentication.md 決定 2)。

        荒らしへの対処はモデレーターが行います
        (`POST /moderation/actions`。docs/adr/0011-moderation.md 決定 2)。

        ### コメントは消えません

        スレッドが論理削除されると一覧からも取得からも消えるため、
        コメントを個別に消して回る必要がありません
        (8 パーティションすべてに UPDATE を投げることにもなります)。

        ### 添付画像もストレージに残ります

        画像を消すのはモデレーションの操作です
        (docs/adr/0011-moderation.md 決定 5)。
        自分のスレッドを消しただけで実体まで消すと、
        誤操作の巻き戻しができなくなります。
      security:
        - sessionCookie: []
      responses:
        '204':
          description: 削除した。本文はありません
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            `code` は `PERMISSION_DENIED` です。原因は 3 つあります。

            - **他人のスレッド**
            - **匿名で立てられたスレッド** (`author_id` が NULL)
            - 状態変更メソッドの `Origin` / `Referer` が許可リストに無い
              (docs/adr/0013-http-defense.md 決定 1)

            **ここでは 404 に隠しません。** スレッドは誰でも
            `GET /threads/{threadId}` で読めるので、存在は公開情報です。
            隠す意味が無いうえ、404 にすると自分の投稿が消せないときに
            「消えたのか、権限が無いのか」を利用者が区別できません。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: スレッドが存在しないか、既に削除されています。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /threads/{threadId}/comments/{commentId}:
    parameters:
      - $ref: '#/components/parameters/ThreadId'
      - $ref: '#/components/parameters/CommentId'
    delete:
      operationId: deleteComment
      tags: [comments]
      summary: 自分のコメントを削除する
      description: |
        **自分が書いたコメントだけ**を削除できます。
        条件と理由はスレッドの削除と同じです。

        ### レス番号は空きます

        削除しても `seq` は再利用しません
        (docs/adr/0019-comment-concurrency.md 決定 5)。
        再利用すると、過去の `>>5` が別の投稿を指すようになります。

        ### スレッド ID がパスに要る理由

        `comments` は `thread_id` による HASH パーティションで、
        主キーが `(thread_id, id)` です。**コメント ID だけでは
        先頭列を絞れず、8 パーティションすべてを走査します。**
      security:
        - sessionCookie: []
      responses:
        '204':
          description: 削除した。本文はありません
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            `code` は `PERMISSION_DENIED` です。
            他人のコメント、匿名のコメント、または `Origin` の検証失敗です
            (スレッドの削除と同じ)。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: |
            コメントが存在しないか、既に削除されています。

            **指定したスレッドに属さないコメント ID も 404 です。**
            パーティションキーで絞るため、他スレッドの行には当たりません。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /threads/{threadId}/comments:
    parameters:
      - $ref: '#/components/parameters/ThreadId'
    get:
      operationId: listComments
      tags: [comments]
      summary: コメント一覧の取得
      description: |
        指定スレッドのコメントを新しい順に取得します。

        comments テーブルは thread_id による HASH パーティションなので、
        thread_id を等値指定するこのクエリでは partition pruning が効き、
        8 分割中 1 パーティションのみを走査します。
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      operationId: createComment
      tags: [comments]
      summary: コメントの投稿
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequest'
      responses:
        '201':
          description: 投稿成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 親スレッドが存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            同時更新が競合しました。再試行可能です。
            SERIALIZABLE 分離レベルでの直列化失敗 (SQLSTATE 40001) や
            デッドロック (40P01) がここに対応します。

            同じ `Idempotency-Key` の処理がまだ完了していない場合も
            ここに入ります (docs/adr/0015-idempotency.md)。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: |
            **同じ `Idempotency-Key` で、前回と違う内容が送られました。**

            前回の結果を黙って返すと、クライアントのバグが見えなくなります。
            キーを作り直して送り直してください
            (docs/adr/0015-idempotency.md)。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: |
        ログイン時に発行される HttpOnly Cookie。

        **`security` を宣言したオペレーションだけが認証必須です。**
        匿名投稿を残す設計 (docs/adr/0005-authentication.md 決定 2) のため、
        スレッド作成やコメント投稿には宣言していません。
        OpenAPI の `security` は「必須」しか表現できず、
        「ログインしていれば投稿者を紐付ける」という任意認証は書けないためです。
        任意認証はハンドラ側で扱います。

  parameters:
    ThreadId:
      name: threadId
      in: path
      required: true
      description: スレッド ID
      schema:
        type: integer
        format: int64
        minimum: 1

    CommentId:
      name: commentId
      in: path
      required: true
      description: |
        コメント ID。

        **レス番号 (`seq`) ではありません。** `seq` はスレッド内の
        通し番号で、削除で欠番が出ます。API が受け取るのは
        `Comment.id` のほうです。
      schema:
        type: integer
        format: int64
        minimum: 1

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        二重送信を防ぐためのキー。クライアントが投稿ごとに 1 つ生成します
        (UUID v4 など、推測されない値)。

        タイムアウト後の再送・回線の切り替え・複数タブ・送信直後のリロードで
        **同じ投稿が 2 件できる**のを防ぎます。送信中のボタン無効化では
        「タイムアウトしたが実は成功していた」を原理的に防げません
        (docs/adr/0015-idempotency.md 決定 1)。

        - **省略できます。** 省略した場合は冪等性なしで処理します
          (必須にすると既存クライアントが即座に壊れるため)
        - **同じキーで再送すると、前回の結果がそのまま返ります**
          (処理は 1 回しか行われません)
        - **同じキーで別の内容を送ると 422 になります。**
          黙って前回の結果を返すと、クライアントのバグが見えなくなるため
        - **未ログインでは無視されます。** 匿名にはキーの名前空間を分ける
          手段がなく、IP で分けると NAT の背後で他人と衝突します
          (同 決定 4)。この非対称は仕様として明記しています
        - 記録は **24 時間**で削除されます。それ以降の再送は新規投稿になります
      schema:
        type: string
        minLength: 1
        maxLength: 255
        # DB 側の CHECK 制約 idempotency_keys_key_length と同じ上限です。
        # 上限が無いと、巨大なキーをそのまま保存させられます。
      example: 6f0c2a1e-6e6a-4e2f-9c4a-2f0f7f2d5c11

    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        次ページの取得位置を表す不透明トークン。
        直前のレスポンスの `nextCursor` をそのまま渡します。
        省略した場合と空文字を渡した場合は、どちらも先頭ページになります。

        中身はサーバ側の実装詳細なので、
        **クライアントは解釈も生成も改変もしないでください。**
        並び順を追加してもこの型は変わりません
        (docs/adr/0018-opaque-cursor.md)。
      schema:
        type: string
        # base64url (パディングなし) なので、この文字集合に収まる。
        # 空文字を許すのは、クライアントが ?cursor=${nextCursor ?? ''} と
        # 組み立てたときに初回ロードだけ 400 になるのを避けるため。
        # 長さの上限がないと、巨大な文字列を復号させられる。
        pattern: '^[A-Za-z0-9_-]*$'
        maxLength: 256
        example: eyJ2IjoxLCJpZCI6NDJ9

    Size:
      name: size
      in: query
      required: false
      description: |
        取得件数。省略時は 20。
        上限を設けないと、1 リクエストで全件走査させられてしまいます。
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20

  responses:
    BadRequest:
      description: リクエストが不正
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: 対象が存在しない
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Unauthorized:
      description: 未ログイン、またはセッションが無効
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Forbidden:
      description: |
        `code` は `PERMISSION_DENIED` です。

        状態変更メソッド (POST / PUT / PATCH / DELETE) の `Origin` または
        `Referer` が許可リストに無い、あるいはどちらも付いていない
        (docs/adr/0013-http-defense.md 決定 1 の CSRF 対策)。

        **ブラウザ以外のクライアントも `Origin` を送る必要があります。**
        `SameSite=Lax` だけではサブドメインを取られた場合に防げないため、
        サーバ側でも検証します。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    ServiceUnavailable:
      description: |
        認証プロバイダの設定が入っていないため、この経路は利用できません。
        設定が無くても API 自体は起動します
        (掲示板の閲覧と匿名投稿は認証に依存しないため)。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    InternalError:
      description: サーバ内部エラー
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
        reason:
          type: string
          description: 異常時のみ設定されます
          example: database

    Thread:
      type: object
      required: [id, title, commentCount, author, icon, createdAt]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        title:
          type: string
          example: Go の並列処理を学ぶ部屋
        commentCount:
          type: integer
          format: int64
          description: 論理削除されていないコメントの件数
          example: 7
        author:
          $ref: '#/components/schemas/Author'
        icon:
          allOf:
            - $ref: '#/components/schemas/Image'
          nullable: true
          description: |
            スレッドアイコン。**設定されていなければ `null`** です。
        createdAt:
          type: string
          format: date-time
          example: '2026-08-02T12:00:00Z'

    Comment:
      type: object
      # image を required に含める。**author と揃える。**
      # 外すと oapi-codegen が omitempty を付け、画像が無いときに
      # キーごと消える。description は「画像がなければ null」と
      # 書いているので、契約と実装が食い違う。
      required: [id, threadId, seq, authorName, author, image, body, createdAt]
      properties:
        id:
          type: integer
          format: int64
          example: 10
        threadId:
          type: integer
          format: int64
          example: 1
        seq:
          type: integer
          format: int32
          minimum: 1
          description: |
            スレッド内のレス番号 (`>>1` の 1)。スレッドごとに 1 から振られます。

            **欠番が出ます。** 削除されたコメントの番号は再利用しません
            (docs/adr/0019-comment-concurrency.md 決定 5)。
            再利用すると、過去の `>>5` が別の投稿を指すようになるためです。

            採番は「読んでから書く」処理なので、同時投稿で競合します。
            この採番がこのリポジトリの主題である並行制御の題材になっています。
          example: 3
        authorName:
          type: string
          description: |
            匿名投稿の表示名。省略時は「名無しさん」になります。

            **`author` があるときは、そちらを表示してください。**
            ログイン中の投稿ではこの欄は既定値のまま保存されます
            (表示名の変更を過去の投稿にも反映させるため。ADR 0014)。
          example: 名無しさん
        author:
          $ref: '#/components/schemas/Author'
        body:
          type: string
          example: ふぁ〜、眠いよ〜
        createdAt:
          type: string
          format: date-time
          example: '2026-08-02T12:00:00Z'
        image:
          allOf:
            - $ref: '#/components/schemas/Image'
          nullable: true
          description: |
            添付された画像。**画像がなければ `null`** です。

            モデレーターに削除された画像もここに現れます
            (`url` は 404 になります)。行を残すのは
            「画像は削除されました」と「元から画像なし」を区別するためです
            (docs/adr/0016-schema-and-indexes.md 問題 3)。

    ThreadList:
      type: object
      required: [threads, nextCursor]
      properties:
        threads:
          type: array
          items:
            $ref: '#/components/schemas/Thread'
        nextCursor:
          $ref: '#/components/schemas/NextCursor'

    CommentList:
      type: object
      required: [comments, nextCursor]
      properties:
        comments:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
        nextCursor:
          $ref: '#/components/schemas/NextCursor'

    NextCursor:
      type: string
      nullable: true
      description: |
        次ページ取得用の不透明トークン。これ以上ページがない場合は null。
        `cursor` パラメータへそのまま渡してください。
      example: eyJ2IjoxLCJpZCI6NDJ9

    CreateThreadRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: DB 側の CHECK 制約 threads_title_length と同じ上限です
          example: 新しいスレッド
        iconImageId:
          type: string
          format: uuid
          description: |
            スレッドアイコンの画像 ID。`POST /images` で
            `kind=thread_icon` として上げたものを渡します。

            - **省略できます。** アイコンの無いスレッドが既定です
            - **自分がアップロードした画像だけ**を指定できます
              (他人の画像 ID は 404)
            - **未ログインでは指定できません** (画像の投稿にログインが要るため)
          example: 018f2c00-0000-7000-8000-000000000001

    Author:
      type: object
      nullable: true
      required: [displayName, withdrawn]
      description: |
        投稿者。**匿名投稿では `null` になります**
        (docs/adr/0005-authentication.md 決定 2)。

        内部 ID (`users.id`) は含めません。`Me` と同じ理由です。

        退会した利用者の投稿は、投稿そのものは残したまま表示だけ差し替えます。
        このとき `publicId` を返しません —— フロントが `withdrawn` の分岐を
        落としても、退会した人のマイページへ辿れないようにするためです。
      properties:
        publicId:
          type: string
          format: uuid
          description: |
            公開用の識別子 (UUID v7)。

            **退会済みの場合はフィールドごと省略されます** (null ではありません)。
            required に入れていないため、生成される型は省略可能になります
          example: 0192f0a0-0000-7000-8000-000000000001
        displayName:
          type: string
          description: 退会済みの場合は「退会したユーザー」に置き換わります
          example: ホシノ
        avatarUrl:
          type: string
          nullable: true
          description: |
            アバター画像の URL。

            **未設定または退会済みの場合はフィールドごと省略されます**
            (`Me.avatarUrl` と同じ挙動)。null が入って返ることはありません
          example: https://lh3.googleusercontent.com/a/xxxx
        withdrawn:
          type: boolean
          description: 退会済みか
          example: false

    Role:
      type: string
      enum: [user, moderator, admin]
      description: |
        利用者の権限 (docs/adr/0011-moderation.md 決定 1)。

        3 段階に分けているのは、**投稿を消せる権限と、
        権限を配れる権限を分離する**ためです。
        モデレーターを増やしても、権限を配れる人間は増えません。

        | | user | moderator | admin |
        | --- | --- | --- | --- |
        | 自分の投稿の削除 | ✅ | ✅ | ✅ |
        | 他人・匿名の投稿の削除 | ❌ | ✅ | ✅ |
        | ロールの変更 | ❌ | ❌ | ✅ |
      example: user

    Me:
      type: object
      required: [publicId, displayName, email, role]
      description: |
        ログイン中の利用者。

        **内部 ID (`users.id`) は含めません。** マイページの URL が連番だと
        全ユーザーを列挙できるため、API が扱う識別子は `publicId` だけです
        (docs/adr/0003-open-questions.md 未決 #11)。
      properties:
        publicId:
          type: string
          format: uuid
          description: 公開用の識別子 (UUID v7)
          example: 0192f0a0-0000-7000-8000-000000000001
        displayName:
          type: string
          example: ホシノ
        email:
          type: string
          description: 本人にだけ返します。投稿一覧には含まれません
          example: hoshino@example.com
        role:
          allOf:
            - $ref: '#/components/schemas/Role'
          description: |
            **自分のロールだけ**返します。
            フロントが管理用の導線を出し分けるために使います。

            他人のロールは `Author` に含めません ——
            誰がモデレーターかを一覧で晒す必要がないためです
        avatarUrl:
          type: string
          nullable: true
          description: |
            プロフィール画像の URL。

            **アップロードした画像があればそちら**を返し、
            無ければ Google のプロフィール画像を返します
            (docs/adr/0007-image-storage.md のスキーマ)。
            クライアントはこの 1 つだけを見れば済みます ——
            どちらから来たかは表示の関心事ではありません。
          example: https://lh3.googleusercontent.com/a/xxxx

    CreateCommentRequest:
      type: object
      required: [body]
      properties:
        authorName:
          type: string
          maxLength: 50
          description: |
            匿名投稿の表示名。省略時は「名無しさん」になります。

            **ログイン中は無視されます。** 表示名は `users` 側から解決するため、
            送っても保存されず、レスポンスの `authorName` は既定値のままになります
            (表示名の変更を過去の投稿にも反映させるため。ADR 0014)。
            エラーにはしません
          example: ホシノ
        body:
          type: string
          minLength: 1
          maxLength: 2000
          example: ふぁ〜、眠いよ〜
        imageId:
          type: string
          format: uuid
          description: |
            添付する画像の ID。`POST /images` で得たものを渡します。

            - **省略できます。** 画像のない投稿が既定です
            - **自分がアップロードした画像だけ**を添付できます。
              他人の画像 ID を指定すると 404 になります
              (存在を隠すため。ADR 0013)
            - 1 件のコメントに 1 枚だけです。複数枚にすると中間テーブルが要り、
              パーティション済みテーブルとの結合がもう 1 段増えます
            - **未ログインでは指定できません** (画像の投稿にログインが要るため)
          example: 018f2c00-0000-7000-8000-000000000001

    ImageKind:
      type: string
      description: |
        画像の用途。**用途によって保存する形式が変わります**
        (docs/adr/0007-image-storage.md 決定 6)。

        コメント添付は写真が主なので JPEG、小さい正方形になる
        プロフィール画像とスレッドアイコンは可逆の WebP で保存します。
      enum:
        - comment_attachment
        - avatar
        - thread_icon
      example: comment_attachment

    Image:
      type: object
      required: [id, url, width, height]
      properties:
        id:
          type: string
          format: uuid
          description: 添付するときに指定する ID。
          example: 018f2c00-0000-7000-8000-000000000001
        url:
          type: string
          format: uri
          description: |
            **絶対 URL を返します** (docs/adr/0007-image-storage.md 決定 5)。

            オブジェクトキーだけを返すと、フロントが CDN のベース URL を
            知る必要が出て、組み立てロジックが Server Component と
            Client Component の 2 か所に散ります。
            環境ごとの差 (ローカルの MinIO と本番の CloudFront) は
            API が吸収します。
          example: https://cdn.example.com/images/018f2c00-0000-7000-8000-000000000001.jpg
        width:
          type: integer
          description: 保存された画像の幅 (再エンコード後)。
          example: 1600
        height:
          type: integer
          description: 保存された画像の高さ (再エンコード後)。
          example: 1200

    ModerationActionType:
      type: string
      description: |
        モデレーション操作の種類 (docs/adr/0011-moderation.md 決定 3)。

        DB 側の CHECK 制約 `moderation_action_valid` には `change_role` も
        含まれますが、**このエンドポイントでは受け付けません。**
        ロール変更は対象と入力の形が違う (新しいロールが要る) ため、
        専用のエンドポイントが書きます。記録先のテーブルは同じです。
      enum:
        - delete_thread
        - delete_comment
        - delete_image
      example: delete_comment

    ModerationTargetType:
      type: string
      description: |
        操作の対象種別。**`action` から一意に決まります**
        (`delete_thread` なら `thread`)。
        リクエストでは受け取らず、レスポンスにだけ現れます ——
        受け取ると `delete_thread` と `image` のように
        食い違う組み合わせを表現できてしまいます。
      enum:
        - thread
        - comment
        - image
        - user
      example: comment

    CreateModerationActionRequest:
      type: object
      required: [action, targetId]
      properties:
        action:
          $ref: '#/components/schemas/ModerationActionType'
        targetId:
          type: string
          maxLength: 64
          description: |
            対象の ID。**型が混在するため文字列です**
            (`threads` / `comments` は BIGINT、`images` は UUID)。
            [ADR 0003](../docs/adr/0003-open-questions.md) の未決 #11 は
            「用途ごとに使い分ける (統一しない)」決定になったため、
            この混在は解消されません。

            `delete_thread` / `delete_comment` では 10 進の整数、
            `delete_image` では UUID を渡してください。
            形式が合わなければ 400 です。
          example: '10'
        threadId:
          type: integer
          format: int64
          minimum: 1
          description: |
            **`delete_comment` のときだけ必須**です。他の操作では無視されます。

            `comments` は `thread_id` による HASH パーティションで、
            主キーが `(thread_id, id)` です。**コメント ID だけでは
            先頭列を絞れず、8 パーティションすべてを走査します。**
            スレッド ID を一緒に受け取ることで partition pruning が効きます。
          example: 1
        reason:
          type: string
          maxLength: 500
          description: |
            削除の理由。**任意です**が、記録の価値はここに集まります。

            DB 側は NULL 可です。省略すると `null` で記録されます。
          example: 誹謗中傷のため
    ModerationAction:
      type: object
      required: [id, action, targetType, targetId, reason, createdAt]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        action:
          $ref: '#/components/schemas/ModerationActionType'
        targetType:
          $ref: '#/components/schemas/ModerationTargetType'
        targetId:
          type: string
          description: |
            記録された対象の ID。**リクエストで送った値とは限りません。**

            - `delete_thread` — スレッド ID (`"7"`)
            - `delete_comment` — **`"{threadId}:{commentId}"`**
              (`"1:10"`)。パーティションキーを含めます ——
              コメント ID だけだと、この記録から対象を引くときに
              8 パーティションすべてを走査することになります
            - `delete_image` — 正規化した UUID (小文字・ハイフンあり)
          example: '1:10'
        reason:
          type: string
          nullable: true
          description: 指定されなかった場合は `null` です。
          example: 誹謗中傷のため
        createdAt:
          type: string
          format: date-time
          example: '2026-08-14T12:00:00Z'

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: 機械可読なエラー種別。クライアントはこの値で分岐します。
              enum:
                - INVALID_ARGUMENT
                - UNAUTHENTICATED
                - NOT_FOUND
                - METHOD_NOT_ALLOWED
                - CONFLICT
                # 403。権限が無い、または状態変更メソッドの Origin / Referer が
                # 許可リストに無い (docs/adr/0013-http-defense.md 決定 1 / 決定 3)。
                #
                # **名前は gRPC の体系に合わせます** (決定 3)。
                # FORBIDDEN にしかけたが、決定 3 の表が PERMISSION_DENIED と
                # 用途 (「権限がない / Origin 検証の失敗」) まで決めていた。
                #
                # **存在を隠したい対象には使いません** —— 他人の画像などは
                # 404 で返します (決定 3「存在を隠すべき場合は 404」)
                - PERMISSION_DENIED
                # 413。画像のサイズ・画素数の上限を超えた
                # (docs/adr/0007-image-storage.md 決定 2 / ADR 0013 決定 3)
                - PAYLOAD_TOO_LARGE
                # 422。同じ冪等キーで別の内容が送られた
                # (docs/adr/0013-http-defense.md 決定 3)
                - FAILED_PRECONDITION
                - UNAVAILABLE
                - INTERNAL
              example: NOT_FOUND
            message:
              type: string
              description: 人間向けの説明。文言は予告なく変わるため分岐に使わないでください。
              example: 対象のリソースが見つかりません
