# =============================================================================
# 掲示板 API の仕様書。
#
# 【このファイルが「正」です】
# ここを手で編集し、そこから以下を自動生成します。
#
#   api/openapi.yaml
#        ├── oapi-codegen ──────→ apps/go-api/internal/httpapi/oapigen/  (Go)
#        └── openapi-typescript ─→ apps/next-app/schema.d.ts             (TS)
#
# Go のハンドラは生成された ServerInterface を実装するため、
# 仕様に無いエンドポイントは実装できず、実装漏れはコンパイルエラーになります。
#
# 編集したら `make generate` を実行してください。
# CI が再生成して差分を検査するため、忘れるとビルドが落ちます。
# =============================================================================
openapi: 3.0.3

info:
  title: Develop Experiments API
  version: 1.0.0
  description: |
    掲示板 API。スレッドとコメントの取得・投稿を提供します。

    一覧系はすべてキーセット (cursor) ページネーションです。
    OFFSET を使わないのは、深いページほど線形に遅くなることと、
    ページ送り中の挿入で行の重複・取りこぼしが起きるためです。

    カーソルは不透明トークンです。中身は実装詳細なので、
    クライアントは `nextCursor` をそのまま `cursor` に渡してください。

servers:
  - url: http://localhost:8080
    description: ローカル開発環境

tags:
  - name: health
    description: 死活監視
  - name: threads
    description: スレッド
  - name: comments
    description: コメント

paths:
  /healthz:
    get:
      operationId: getHealthz
      tags: [health]
      summary: Liveness プローブ
      description: |
        プロセスが生きているかだけを返します。DB の状態は見ません。
        ここで DB を見ると、DB の一時的な不調でコンテナが再起動ループに入ります。
      responses:
        '200':
          description: 正常
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  /readyz:
    get:
      operationId: getReadyz
      tags: [health]
      summary: Readiness プローブ
      description: DB への疎通を含め、リクエストを受けられる状態かを返します。
      responses:
        '200':
          description: リクエスト受付可能
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: 依存先が利用できない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  /threads:
    get:
      operationId: listThreads
      tags: [threads]
      summary: スレッド一覧の取得
      description: |
        スレッドを新しい順に、コメント数つきで取得します。

        コメント数は LEFT JOIN と COUNT(*) FILTER による単一クエリで集計しています。
        スレッドごとに COUNT を投げる実装 (N+1) を goroutine で並列化しても
        DB へのラウンドトリップ回数は減らないため、単一クエリのほうが有利です。
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      operationId: createThread
      tags: [threads]
      summary: スレッドの作成
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateThreadRequest'
      responses:
        '201':
          description: 作成成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Thread'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /threads/{threadId}:
    parameters:
      - $ref: '#/components/parameters/ThreadId'
    get:
      operationId: getThread
      tags: [threads]
      summary: スレッドの取得
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Thread'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /threads/{threadId}/comments:
    parameters:
      - $ref: '#/components/parameters/ThreadId'
    get:
      operationId: listComments
      tags: [comments]
      summary: コメント一覧の取得
      description: |
        指定スレッドのコメントを新しい順に取得します。

        comments テーブルは thread_id による HASH パーティションなので、
        thread_id を等値指定するこのクエリでは partition pruning が効き、
        8 分割中 1 パーティションのみを走査します。
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      operationId: createComment
      tags: [comments]
      summary: コメントの投稿
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequest'
      responses:
        '201':
          description: 投稿成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: 親スレッドが存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            同時更新が競合しました。再試行可能です。
            SERIALIZABLE 分離レベルでの直列化失敗 (SQLSTATE 40001) や
            デッドロック (40P01) がここに対応します。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  parameters:
    ThreadId:
      name: threadId
      in: path
      required: true
      description: スレッド ID
      schema:
        type: integer
        format: int64
        minimum: 1

    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        次ページの取得位置を表す不透明トークン。
        直前のレスポンスの `nextCursor` をそのまま渡します。
        省略すると先頭ページになります。

        中身はサーバ側の実装詳細なので、
        **クライアントは解釈も生成も改変もしないでください。**
        並び順を追加してもこの型は変わりません
        (docs/adr/0006-view-count-and-popularity.md)。
      schema:
        type: string
        # base64url (パディングなし) なので、この文字集合に収まる。
        # 長さの上限がないと、巨大な文字列を復号させられる。
        pattern: '^[A-Za-z0-9_-]+$'
        maxLength: 256
        example: eyJ2IjoxLCJpZCI6NDJ9

    Size:
      name: size
      in: query
      required: false
      description: |
        取得件数。省略時は 20。
        上限を設けないと、1 リクエストで全件走査させられてしまいます。
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20

  responses:
    BadRequest:
      description: リクエストが不正
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: 対象が存在しない
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    InternalError:
      description: サーバ内部エラー
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
        reason:
          type: string
          description: 異常時のみ設定されます
          example: database

    Thread:
      type: object
      required: [id, title, commentCount, createdAt]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        title:
          type: string
          example: Go の並列処理を学ぶ部屋
        commentCount:
          type: integer
          format: int64
          description: 論理削除されていないコメントの件数
          example: 7
        createdAt:
          type: string
          format: date-time
          example: '2026-08-02T12:00:00Z'

    Comment:
      type: object
      required: [id, threadId, authorName, body, createdAt]
      properties:
        id:
          type: integer
          format: int64
          example: 10
        threadId:
          type: integer
          format: int64
          example: 1
        authorName:
          type: string
          example: 名無しさん
        body:
          type: string
          example: ふぁ〜、眠いよ〜
        createdAt:
          type: string
          format: date-time
          example: '2026-08-02T12:00:00Z'

    ThreadList:
      type: object
      required: [threads, nextCursor]
      properties:
        threads:
          type: array
          items:
            $ref: '#/components/schemas/Thread'
        nextCursor:
          $ref: '#/components/schemas/NextCursor'

    CommentList:
      type: object
      required: [comments, nextCursor]
      properties:
        comments:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
        nextCursor:
          $ref: '#/components/schemas/NextCursor'

    NextCursor:
      type: string
      nullable: true
      description: |
        次ページ取得用の不透明トークン。これ以上ページがない場合は null。
        `cursor` パラメータへそのまま渡してください。
      example: eyJ2IjoxLCJpZCI6NDJ9

    CreateThreadRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: DB 側の CHECK 制約 threads_title_length と同じ上限です
          example: 新しいスレッド

    CreateCommentRequest:
      type: object
      required: [body]
      properties:
        authorName:
          type: string
          maxLength: 50
          description: 省略時は「名無しさん」になります
          example: ホシノ
        body:
          type: string
          minLength: 1
          maxLength: 2000
          example: ふぁ〜、眠いよ〜

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: 機械可読なエラー種別。クライアントはこの値で分岐します。
              enum:
                - INVALID_ARGUMENT
                - NOT_FOUND
                - METHOD_NOT_ALLOWED
                - CONFLICT
                - INTERNAL
              example: NOT_FOUND
            message:
              type: string
              description: 人間向けの説明。文言は予告なく変わるため分岐に使わないでください。
              example: 対象のリソースが見つかりません
