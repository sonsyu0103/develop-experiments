name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # --------------------------------------------------
  # Go Backend Checks
  # --------------------------------------------------
  go-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/go-api
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: apps/go-api/go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.58
          working-directory: apps/go-api

      - name: Run Vulnerability Check (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Run Go Tests with Race Detector
        run: go test -v -race -cover ./...

  # --------------------------------------------------
  # Next.js Frontend Checks
  # --------------------------------------------------
  next-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/next-app
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      - name: Run ESLint
        run: npm run lint